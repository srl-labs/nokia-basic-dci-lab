subscriptions:
  # OPENCONFIG XPATHS:
  oc_port_oper_state:
    paths:
      - interfaces/interface[name=*]/subinterfaces/subinterface[index=*]/state/oper-status
    mode: stream
    stream-mode: sample
    sample-interval: 2s  

  oc_port_stats:
    paths:
      - interfaces/interface[name=*]/state/counters
    mode: stream
    stream-mode: sample
    sample-interval: 2s  
  # NOKIA SR LINUX XPATHS
  srl_if_oper_state:
    paths:
      - /interface[name=ethernet-1/*]/oper-state
    mode: stream
    stream-mode: sample
    sample-interval: 2s

  srl_net_instance:
    paths:
      - /network-instance[name=*]/oper-state
    mode: stream
    stream-mode: sample
    sample-interval: 2s

  srl_if_stats:
    paths:
      - /interface[name=ethernet-1/*]/statistics
    mode: stream
    stream-mode: sample
    sample-interval: 2s

  srl_if_traffic_rate:
    paths:
      - /interface[name=ethernet-1/*]/traffic-rate
    mode: stream
    stream-mode: sample
    sample-interval: 2s

outputs:
  prom:
    type: prometheus
    listen: :9173
    path: /metrics
    metric-prefix: gnmic
    append-subscription-name: true
    export-timestamps: true
    debug: false
    event-processors:
      - trim-prefixes
      - up-down-map
  # stdout:
  #   type: file
  #   file-type: stdout
  #   event-processors:
  #     - proc-convert-strings-to-int
  #     - trim-prefixes

processors:
  trim-prefixes:
    event-strings:
      value-names:
        - ".*"
      transforms:
        - path-base:
            apply-on: "name"
  up-down-map:
    event-strings:
      value-names:
        - oper-state
        - oper-status
        - admin-state
      transforms:
        - replace:
            apply-on: "value"
            old: "up"
            new: "1"
        - replace:
            apply-on: "value"
            old: "UP"
            new: "1"
        - replace:
            apply-on: "value"
            old: "DOWN"
            new: "0"
        - replace:
            apply-on: "value"
            old: "down"
            new: "0"
        - replace:
            apply-on: "value"
            old: "enable"
            new: "1"
        - replace:
            apply-on: "value"
            old: "disable"
            new: "0"
